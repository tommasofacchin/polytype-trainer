<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="settings.pageTitle">Settings - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="settings">
    <div id="app-header"></div>
    <main class="page-content" style="max-width:520px">
        <a class="back-link-mini" href="profile.html">&lsaquo; <span data-i18n="nav.profile">Profile</span></a>
        <h1 class="page-title" data-i18n="settings.title">Settings</h1>

        <div class="settings-avatar-hero">
            <div class="settings-avatar-wrap">
                <div id="profile-page-avatar" class="profile-avatar" aria-hidden="true">T</div>
                <button id="profile-avatar-upload-btn" class="settings-avatar-edit-btn" type="button" data-i18n-aria-label="profile.uploadPhoto" aria-label="Upload photo">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <input id="profile-avatar-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp">
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" data-i18n="settings.sectionProfile">Profile</div>
            <div class="settings-card">
                <div class="settings-row">
                    <div class="settings-row-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" data-i18n="profile.fullName">Full name</span>
                        <form id="profile-name-form">
                            <input id="profile-name-input" class="settings-input" type="text" autocomplete="name" maxlength="40" placeholder="Tommaso" data-i18n-placeholder="profile.fullNamePlaceholder">
                            <button id="profile-name-save-btn" class="restart-btn settings-save-btn" type="submit" data-i18n="profile.saveName">Edit</button>
                        </form>
                    </div>
                </div>
                <div class="settings-row">
                    <div class="settings-row-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/><path d="M9 9c0 1.7 1.3 3 3 3s3-1.3 3-3-1.3-4-3-4-3 2.3-3 4Z"/></svg>
                    </div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" data-i18n="profile.username">Username</span>
                        <form id="profile-handle-form">
                            <input id="profile-handle-input" class="settings-input" type="text" autocomplete="username" maxlength="20" inputmode="latin" pattern="[a-z0-9_]{3,20}" placeholder="@tommaso" data-i18n-placeholder="profile.usernamePlaceholder">
                            <button id="profile-handle-save-btn" class="restart-btn settings-save-btn" type="submit" data-i18n="profile.saveUsername">Edit</button>
                        </form>
                    </div>
                </div>
            </div>
            <p id="profile-edit-status" class="settings-status" aria-live="polite" data-i18n="profile.signInToEdit">Sign in to edit your profile.</p>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" data-i18n="settings.sectionPreferences">Preferences</div>
            <div class="settings-card">
                <div class="settings-row">
                    <div class="settings-row-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4Z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>
                    </div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" data-i18n="settings.soundEffects">Sound effects</span>
                        <p class="settings-row-help" data-i18n="settings.soundEffectsHelp">Play a sound on correct and incorrect answers.</p>
                    </div>
                    <button id="settings-sound-toggle" class="settings-switch" type="button" aria-pressed="false" data-i18n-aria-label="settings.soundEffects" aria-label="Sound effects"></button>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" data-i18n="profile.account">Account</div>
            <div class="settings-card">
                <div class="settings-row">
                    <div class="settings-row-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
                    </div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" data-i18n="profile.account">Account</span>
                        <p id="settings-account-email" class="settings-row-help">-</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" data-i18n="settings.sectionSession">Session</div>
            <button id="settings-logout-btn" class="settings-logout-btn" type="button">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                <span data-i18n="trainer.signOut">Log out</span>
            </button>
        </div>
    </main>
    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/virtual-keyboard.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
