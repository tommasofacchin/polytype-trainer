<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="settings.pageTitle">Settings - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page">
    <main class="page-content" style="max-width:520px">
        <a class="back-link-mini" href="profile.html">&lsaquo; <span data-i18n="nav.profile">Profile</span></a>
        <h1 class="page-title" data-i18n="settings.title">Settings</h1>

        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:18px">
            <div id="profile-page-avatar" class="profile-avatar" style="width:76px;height:76px;font-size:30px;margin-bottom:10px" aria-hidden="true">T</div>
            <button id="profile-avatar-upload-btn" class="restart-btn" type="button" style="padding:9px 16px;font-size:12px" data-i18n="profile.uploadPhoto">Change photo</button>
            <input id="profile-avatar-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp">
        </div>

        <div style="font-size:10px;font-weight:800;color:var(--text-faint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em" data-i18n="profile.username">Username</div>
        <form id="profile-handle-form" style="display:flex;gap:8px;margin-bottom:16px">
            <input id="profile-handle-input" type="text" autocomplete="username" maxlength="20" inputmode="latin" pattern="[a-z0-9_]{3,20}" placeholder="@tommaso" data-i18n-placeholder="profile.usernamePlaceholder" style="flex:1;min-width:0;box-sizing:border-box;background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;padding:12px 14px;color:var(--text);font-family:var(--font-sans);font-weight:700;font-size:14px">
            <button id="profile-handle-save-btn" class="restart-btn" type="submit" style="padding:0 18px" data-i18n="profile.saveUsername">Edit</button>
        </form>
        <p id="profile-edit-status" class="profile-muted" aria-live="polite" data-i18n="profile.signInToEdit">Sign in to edit your profile.</p>

        <div style="font-size:10px;font-weight:800;color:var(--text-faint);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em" data-i18n="profile.account">Account</div>
        <div style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:20px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
            <span id="settings-account-email" style="flex:1;font-weight:700;font-size:13px;color:var(--text-soft)">-</span>
        </div>

        <button id="settings-logout-btn" type="button" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-border);border-radius:14px;padding:13px;font-family:var(--font-sans);font-weight:800;font-size:14px;cursor:pointer">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            <span data-i18n="trainer.signOut">Log out</span>
        </button>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
