<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="sprint.pageTitle">Sprint - Polytype Trainer</title>
  <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-fixed-page" data-tab="games">
  <div id="app-header"></div>
  <main class="app">
    <div class="sprint-topline">
      <span id="sprint-category-chip" class="sprint-category-chip" hidden></span>
      <div id="sprint-progress" class="sprint-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria-label="sprint.round" aria-label="Round">
        <div id="sprint-progress-fill" class="sprint-progress-fill"></div>
      </div>
    </div>

    <section class="game-hud is-two-up" aria-label="Session score">
      <div class="hud-item">
        <span class="hud-label" data-i18n="trainer.score">Score</span>
        <strong id="sprint-hud-score-text">0 pts</strong>
      </div>
      <div class="hud-item" id="sprint-streak-hud">
        <span class="hud-label" data-i18n="trainer.combo">Combo</span>
        <div class="streak-display">
          <strong id="sprint-streak-text">0</strong>
          <span id="sprint-streak-chip" class="streak-chip" hidden></span>
        </div>
      </div>
    </section>

    <section class="list-card sprint-stage" aria-label="Sprint exercise">
      <div id="sprint-exercise-root">
        <div class="game-loading-screen">
          <div class="game-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="game-loading-text" data-i18n="common.loadingWords">Loading your words...</p>
        </div>
      </div>
    </section>
  </main>
  <div id="app-bottom-nav"></div>

  <div id="sprint-result-modal" class="timer-modal game-result-overlay" role="dialog" aria-modal="true" hidden>
    <div class="timer-modal-backdrop"></div>
    <div class="timer-modal-card">
      <span class="result-label" data-i18n="sprint.sessionComplete">Sprint complete</span>
      <strong id="sprint-result-score" class="result-score-text">0 pts</strong>
      <span id="sprint-result-detail" class="result-detail-text"></span>
      <div id="sprint-result-breakdown" class="sprint-result-breakdown"></div>
      <span id="sprint-result-xp" class="result-xp-text"></span>
      <span id="sprint-result-coins" class="result-coins-text"></span>
      <span id="sprint-result-save-status" class="result-save-status"></span>
      <div id="sprint-result-friends" class="sprint-result-friends" hidden>
        <h3 class="sprint-result-friends-title" data-i18n="sprint.friendsTitle">Friends</h3>
        <div id="sprint-result-friends-list" class="friends-result-list"></div>
      </div>
      <div class="sprint-result-actions">
        <button id="sprint-play-again-btn" class="restart-btn" type="button" data-i18n="trainer.playAgain">Play again</button>
        <a id="sprint-home-btn" href="index.html" class="restart-btn is-secondary" data-i18n="common.home">Home</a>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/router.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/virtual-keyboard.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="js/gamestate.js"></script>
  <script src="js/mission-celebrate.js"></script>
  <script src="decks/index.js"></script>
  <script src="decks/categories.js"></script>
  <script src="js/sprint.js"></script>
</body>
</html>
