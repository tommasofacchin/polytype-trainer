<!DOCTYPE html>
<html lang="en" class="profile-document">
<head>
    <meta charset="UTF-8">
    <title data-i18n="friends.title">Friends - Polytype Trainer</title>
  <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="friends">
  <div id="app-header"></div>
  <main class="profile-page friends-page">
    <section class="profile-hero friends-hero" aria-label="Friends">
      <div class="profile-hero-copy">
        <span class="profile-kicker" data-i18n="friends.heading">Friends</span>
        <h1 data-i18n="friends.heading">Friends</h1>
        <p class="profile-muted" data-i18n="friends.subtitle">Find friends and see who's leading the pack.</p>
      </div>
    </section>

    <p id="friends-page-status" class="profile-muted friends-page-status" aria-live="polite"></p>

    <a id="find-friends-btn" href="find-friends.html" class="btn-solid friends-find-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span data-i18n="friends.findFriends">Find friends</span>
    </a>

    <section id="friends-incoming-card" class="friends-card" hidden>
      <div class="profile-card-head">
        <span class="profile-card-label" data-i18n="friends.incomingRequests">Friend requests</span>
      </div>
      <div id="friends-incoming-list" class="friends-result-list"></div>
    </section>

    <section id="friends-outgoing-card" class="friends-card" hidden>
      <div class="profile-card-head">
        <span class="profile-card-label" data-i18n="friends.outgoingRequests">Sent requests</span>
      </div>
      <div id="friends-outgoing-list" class="friends-chip-list"></div>
    </section>

    <section class="friends-card">
      <div class="profile-card-head">
        <span class="profile-card-label" data-i18n="friends.leaderboard">Leaderboard</span>
        <span class="profile-card-hint" data-i18n="friends.leaderboardResets">Resets every Monday</span>
      </div>
      <div id="friends-leaderboard-list" class="friends-leaderboard-list"></div>
    </section>

    <section id="friends-activity-card" class="friends-card" hidden>
      <div class="profile-card-head">
        <span class="profile-card-label" data-i18n="friends.activity">Activity</span>
      </div>
      <div id="friends-activity-list" class="friends-result-list"></div>
    </section>
  </main>
  <div id="app-bottom-nav"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/router.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/virtual-keyboard.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="js/gamestate.js"></script>
  <script src="js/friends.js"></script>
</body>
</html>
