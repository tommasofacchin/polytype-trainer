<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dictate - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-fixed-page" data-tab="games">
<div id="app-header"></div>
<main class="dictate-page">

    <nav class="dictate-topbar" aria-label="Dictate navigation">
        <a class="back-link-mini" href="games.html"><span data-i18n="nav.games">Games</span></a>
        <div class="dictate-topbar-end">
            <div class="language-menu">
                <button id="dictate-lang-toggle" class="language-menu-toggle" type="button"
                        aria-haspopup="true" aria-expanded="false" aria-label="Choose study language">
                    <img id="current-language-flag" class="flag-mark" src="assets/flags/norway.svg" alt="">
                </button>
                <div id="dictate-lang-menu" class="language-menu-panel" role="menu" hidden></div>
            </div>
        </div>
    </nav>

    <!-- Radial audio visualization -->
    <div class="dictate-viz-wrap">
        <div id="audio-viz" class="audio-viz" aria-hidden="true">
            <div class="audio-ring audio-ring-1"></div>
            <div class="audio-ring audio-ring-2"></div>
            <div class="audio-ring audio-ring-3"></div>
            <div class="audio-ring audio-ring-4"></div>
            <button id="replay-btn" class="replay-btn" type="button" aria-label="Replay audio (R)">
                <!-- Speaker / audio icon -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Score HUD -->
    <div class="dictate-hud" aria-label="Session score">
        <div class="dictate-hud-item">
            <span class="dictate-hud-label" data-i18n="trainer.time">Time</span>
            <strong id="dictate-timer">--</strong>
        </div>
        <div class="dictate-hud-item">
            <span class="dictate-hud-label">Score</span>
            <strong id="dictate-score">0 pts</strong>
        </div>
        <div class="dictate-hud-item">
            <span class="dictate-hud-label">Streak</span>
            <strong id="dictate-streak">0</strong>
        </div>
        <div class="dictate-hud-item">
            <span class="dictate-hud-label">Accuracy</span>
            <strong id="dictate-accuracy">100%</strong>
        </div>
    </div>
    <p id="dictate-save-status" class="dictate-modal-sub" style="text-align:center;margin:0;min-height:16px" aria-live="polite"></p>

    <!-- Scrollable rows — one column -->
    <section class="dictate-card" aria-label="Dictation exercise">
        <div id="dictate-rows"></div>

        <div id="dictate-start-modal" role="dialog" aria-modal="true" aria-labelledby="dictate-modal-title">
            <div class="dictate-modal-backdrop"></div>
            <div class="dictate-modal-card">
                <span class="dictate-modal-kicker">Dictate</span>
                <h2 id="dictate-modal-title" class="dictate-modal-title" data-i18n="trainer.chooseTimeTitle">How long do you want to play?</h2>
                <p class="dictate-modal-sub" data-i18n="trainer.chooseTimeBody">Pick a session length to start.</p>
                <div class="trainer-duration-grid">
                    <button type="button" class="trainer-duration-btn" data-gate-seconds="30" data-i18n="trainer.duration30s">30 sec</button>
                    <button type="button" class="trainer-duration-btn" data-gate-seconds="120" data-i18n="trainer.duration2m">2 min</button>
                    <button type="button" class="trainer-duration-btn" data-gate-seconds="300" data-i18n="trainer.duration5m">5 min</button>
                </div>
            </div>
        </div>
    </section>

</main>
<div id="app-bottom-nav"></div>

<div id="dictate-result-modal" class="timer-modal game-result-overlay" role="dialog" aria-modal="true" hidden>
    <div class="timer-modal-backdrop"></div>
    <div class="timer-modal-card">
        <span class="result-label" data-i18n="trainer.timeUp">Time up</span>
        <strong id="dictate-result-score" class="result-score-text">0 pts</strong>
        <span id="dictate-result-detail" class="result-detail-text"></span>
        <span id="dictate-result-coins" class="result-coins-text"></span>
        <span id="dictate-result-save-status" class="result-save-status"></span>
        <div class="sprint-result-actions">
            <button id="dictate-play-again-btn" class="restart-btn" type="button" data-i18n="trainer.playAgain">Play again</button>
            <a id="dictate-games-btn" href="games.html" class="restart-btn is-secondary" data-i18n="nav.games">Games</a>
        </div>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/router.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/virtual-keyboard.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="js/firebase-client.js"></script>
<script src="js/gamestate.js"></script>
<script src="decks/index.js"></script>
<script src="decks/categories.js"></script>
<script src="js/mission-celebrate.js"></script>
<script src="js/streak-celebrate.js"></script>
<script src="js/dictate.js"></script>
</body>
</html>
