<!DOCTYPE html>
<html lang="en" class="dictate-document">
<head>
    <meta charset="UTF-8">
    <title>Dictate - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html.dictate-document,
        html.dictate-document body {
            height: 100%;
            overflow: hidden;
        }

        .dictate-page {
            width: min(100% - 28px, 680px);
            height: 100%;
            flex: 1;
            min-height: 0;
            margin-inline: auto;
            padding-block: 14px;
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            overflow: hidden;
        }

        /* ── Topbar ──────────────────────────────────────────────── */
        .dictate-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            flex-shrink: 0;
        }

        .dictate-topbar-end {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        /* ── Audio visualization ─────────────────────────────────── */
        .dictate-viz-wrap {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0 4px;
        }

        .audio-viz {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--accent);
            pointer-events: none;
            opacity: 0;
        }

        .audio-ring-1 { width: 90px;  height: 90px; }
        .audio-ring-2 { width: 130px; height: 130px; }
        .audio-ring-3 { width: 170px; height: 170px; }
        .audio-ring-4 { width: 210px; height: 210px; }

        /* Idle state: faint permanent rings as a visual hint */
        .audio-ring-1 { opacity: 0.18; }
        .audio-ring-2 { opacity: 0.10; }
        .audio-ring-3 { opacity: 0.06; }
        .audio-ring-4 { opacity: 0.03; }

        /* Playing state: pulsing radial animation */
        .audio-viz.is-playing .audio-ring {
            animation: ring-pulse 1.8s cubic-bezier(0.15, 0.6, 0.35, 1) infinite;
        }

        .audio-viz.is-playing .audio-ring-1 { animation-delay: 0s; }
        .audio-viz.is-playing .audio-ring-2 { animation-delay: 0.3s; }
        .audio-viz.is-playing .audio-ring-3 { animation-delay: 0.6s; }
        .audio-viz.is-playing .audio-ring-4 { animation-delay: 0.9s; }

        @keyframes ring-pulse {
            0%   { transform: scale(0.55); opacity: 0.85; }
            80%  { opacity: 0.15; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .replay-btn {
            position: relative;
            z-index: 1;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: var(--text-inverse);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px color-mix(in srgb, var(--accent) 45%, transparent);
            transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
            flex-shrink: 0;
        }

        .replay-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.08);
            box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 55%, transparent);
        }

        .replay-btn:active {
            transform: scale(0.94);
        }

        .replay-btn svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .audio-viz.is-playing .replay-btn {
            animation: btn-pulse 1.8s ease infinite;
        }

        @keyframes btn-pulse {
            0%, 100% { box-shadow: 0 4px 20px color-mix(in srgb, var(--accent) 45%, transparent); }
            50%       { box-shadow: 0 6px 28px color-mix(in srgb, var(--accent) 70%, transparent); }
        }

/* ── HUD ─────────────────────────────────────────────────── */
        .dictate-hud {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--space-3);
            flex-shrink: 0;
        }

        .dictate-hud-item {
            display: grid;
            gap: 2px;
            padding: 10px 14px;
        }

        .dictate-hud-label {
            color: var(--text-faint);
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .dictate-hud-item strong {
            color: var(--text);
            font-size: var(--text-xl);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        /* ── Rows card ───────────────────────────────────────────── */
        .dictate-card {
            flex: 1;
            min-height: 0;
            position: relative;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        #dictate-rows {
            height: 100%;
            overflow-y: auto;
            padding: var(--space-3) 0;
            scroll-behavior: auto;
            scrollbar-width: none;
        }

        #dictate-rows::-webkit-scrollbar { display: none; }

        /* ── Each row ────────────────────────────────────────────── */
        .dictate-row {
            padding: 10px var(--space-5);
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-bottom: 1px solid var(--border);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.22s ease, transform 0.22s ease, background 0.16s ease;
        }

        .dictate-row:last-child { border-bottom: 0; }

        .dictate-row.visible {
            opacity: 1;
            transform: none;
        }

        .dictate-typed {
            width: 100%;
            padding: 6px 0;
            min-height: 2em;
            font-size: var(--text-lg);
            font-family: inherit;
            font-weight: 500;
            color: var(--text);
            text-align: center;
            line-height: 1.4;
            letter-spacing: 0.01em;
            user-select: none;
        }

        .dictate-typed:empty::before {
            content: "|";
            color: var(--accent);
            animation: caret-blink 1.1s step-end infinite;
        }

        @keyframes caret-blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        .dictate-typed.is-correct {
            color: var(--success);
            font-weight: 600;
        }

        .dictate-typed.is-correct:empty::before,
        .dictate-typed.is-wrong:empty::before {
            display: none;
        }

        .dictate-typed.is-wrong {
            color: var(--danger);
        }

        .dictate-feedback {
            font-size: var(--text-sm);
            font-weight: 500;
            min-height: 18px;
            line-height: 1.3;
            text-align: center;
        }

        .dictate-feedback.is-correct {
            color: var(--success);
        }

        .dictate-feedback.is-wrong {
            color: var(--text-soft);
        }

        /* Past rows */
        .dictate-row.past-row {
            padding-block: 8px;
        }

        /* Next preview (dim) */
        .dictate-row.inactive-row {
            opacity: 0.38;
        }

        .dictate-row.next-preview {
            opacity: 0.65;
        }

        /* Empty state */
        .dictate-empty {
            padding: 40px 24px;
            text-align: center;
            color: var(--text-soft);
            font-size: var(--text-sm);
            line-height: 1.6;
        }

        /* ── Start overlay ───────────────────────────────────────── */
        #dictate-start-modal {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        #dictate-start-modal[hidden] { display: none; }

        .dictate-modal-backdrop {
            position: absolute;
            inset: 0;
            background: color-mix(in srgb, var(--surface) 80%, transparent);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            border-radius: var(--radius-xl);
        }

        .dictate-modal-card {
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-3);
        }

        .dictate-modal-kicker {
            display: block;
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .dictate-modal-title {
            margin: 0;
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .dictate-modal-sub {
            color: var(--text-soft);
            font-size: var(--text-sm);
            max-width: 320px;
            line-height: 1.5;
        }

        /* ── Mobile ──────────────────────────────────────────────── */
        @media (max-width: 600px) {
            .dictate-page {
                width: 100%;
                padding: 12px 12px 24px;
                gap: var(--space-3);
            }

            .audio-viz {
                width: 160px;
                height: 160px;
            }

            .audio-ring-1 { width: 74px;  height: 74px; }
            .audio-ring-2 { width: 108px; height: 108px; }
            .audio-ring-3 { width: 142px; height: 142px; }
            .audio-ring-4 { width: 176px; height: 176px; }

            .replay-btn {
                width: 58px;
                height: 58px;
            }

            .dictate-viz-wrap { padding: 4px 0 0; }

            .dictate-hud-item { padding: 8px 10px; }
            .dictate-hud-item strong { font-size: var(--text-lg); }

            .dictate-row { padding: 8px var(--space-4); }
            .dictate-typed { font-size: var(--text-md); }
        }

        @media (prefers-reduced-motion: reduce) {
            .audio-viz.is-playing .audio-ring,
            .audio-viz.is-playing .replay-btn { animation: none; }
            .dictate-row { transition: opacity 0.1s; }
        }
    </style>
</head>
<body class="has-app-shell is-fixed-page" data-tab="games">
<div id="app-header"></div>
<main class="dictate-page">

    <nav class="dictate-topbar" aria-label="Dictate navigation">
        <a class="back-link-mini" href="games.html">&lsaquo; <span data-i18n="nav.games">Games</span></a>
        <div class="dictate-topbar-end">
            <div class="language-menu">
                <button id="dictate-lang-toggle" class="language-menu-toggle" type="button"
                        aria-haspopup="true" aria-expanded="false" aria-label="Choose study language">
                    <img id="current-language-flag" class="flag-mark" src="assets/flags/norway.svg" alt="">
                </button>
                <div id="dictate-lang-menu" class="language-menu-panel" role="menu" hidden></div>
            </div>
        </div>
    </nav>

    <!-- Radial audio visualization -->
    <div class="dictate-viz-wrap">
        <div id="audio-viz" class="audio-viz" aria-hidden="true">
            <div class="audio-ring audio-ring-1"></div>
            <div class="audio-ring audio-ring-2"></div>
            <div class="audio-ring audio-ring-3"></div>
            <div class="audio-ring audio-ring-4"></div>
            <button id="replay-btn" class="replay-btn" type="button" aria-label="Replay audio (R)">
                <!-- Speaker / audio icon -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Score HUD -->
    <div class="dictate-hud" aria-label="Session score">
        <div class="dictate-hud-item">
            <span class="dictate-hud-label">Score</span>
            <strong id="dictate-score">0 pts</strong>
        </div>
        <div class="dictate-hud-item">
            <span class="dictate-hud-label">Streak</span>
            <strong id="dictate-streak">0</strong>
        </div>
        <div class="dictate-hud-item">
            <span class="dictate-hud-label">Accuracy</span>
            <strong id="dictate-accuracy">100%</strong>
        </div>
    </div>
    <p id="dictate-save-status" class="dictate-modal-sub" style="text-align:center;margin:0;min-height:16px" aria-live="polite"></p>

    <!-- Scrollable rows — one column -->
    <section class="dictate-card" aria-label="Dictation exercise">
        <div id="dictate-rows"></div>

        <div id="dictate-start-modal" role="dialog" aria-modal="true" aria-labelledby="dictate-modal-title">
            <div class="dictate-modal-backdrop"></div>
            <div class="dictate-modal-card">
                <span class="dictate-modal-kicker">Dictate</span>
                <h2 id="dictate-modal-title" class="dictate-modal-title">Listen &amp; write</h2>
                <p class="dictate-modal-sub">Audio plays automatically. Type what you hear and press Enter to submit. Press R to replay.</p>
                <button id="dictate-start-btn" class="restart-btn" type="button">Start</button>
            </div>
        </div>
    </section>

</main>
<div id="app-bottom-nav"></div>

<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="js/i18n.js"></script>
<script src="js/firebase-client.js"></script>
<script src="js/gamestate.js"></script>
<script src="js/app-shell.js"></script>
<script src="decks/index.js"></script>
<script src="decks/categories.js"></script>
<script src="js/dictate.js"></script>
</body>
</html>
