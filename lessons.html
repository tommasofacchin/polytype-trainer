<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="lessons.pageTitle">Lessons - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/norway.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="games">
    <div id="app-header"></div>

    <main class="page-content lessons-page">
        <nav class="profile-topbar" aria-label="Lessons navigation">
            <a class="back-link-mini" href="games.html"><span data-i18n="nav.games">Games</span></a>
        </nav>

        <div id="lessons-path-view">
            <h1 class="page-title" data-i18n="lessons.title">Lessons</h1>
            <p class="page-subtitle" data-i18n="lessons.subtitle">Learn Norwegian grammar step by step</p>
            <div id="lessons-modules" class="lessons-modules"></div>
        </div>

        <div id="lessons-player-view" hidden>
            <button type="button" id="lessons-back-btn" class="back-link-mini lessons-player-back"><span data-i18n="lessons.backBtn">Back</span></button>

            <section id="lessons-exercise-screen" class="lessons-card lessons-exercise-screen" hidden>
                <div id="lessons-review-banner" class="lessons-review-banner" hidden></div>
                <span id="lessons-exercise-progress" class="lessons-exercise-progress"></span>
                <!-- Sprint's bar, borrowed for review runs only: a lesson is six
                     exercises and the "3 / 6" line above already reads as pace,
                     while a review run is two to three times longer. -->
                <div id="lessons-progress" class="sprint-progress lessons-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria-label="lessons.reviewTitle" aria-label="Review" hidden>
                    <div id="lessons-progress-fill" class="sprint-progress-fill"></div>
                </div>
                <div id="lessons-exercise-root"></div>
            </section>

            <section id="lessons-complete-screen" class="lessons-card lessons-complete-screen" hidden>
                <span class="lessons-complete-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l5 5L19.5 6.8"/></svg></span>
                <h2 id="lessons-complete-title" class="lessons-complete-title"></h2>
                <span id="lessons-complete-detail" class="lessons-complete-detail"></span>
                <span id="lessons-complete-coins" class="lessons-complete-coins"></span>
                <span id="lessons-complete-status" class="lessons-complete-status"></span>
                <button type="button" id="lessons-continue-btn" class="restart-btn" data-i18n="lessons.continueBtn">Continue</button>
            </section>
        </div>

        <!-- Lesson intro sheet: slides up from the bottom when a lesson node
             is tapped. Its "Start lesson" button drops the player straight
             into the exercises (see js/lessons.js). -->
        <div id="lessons-sheet" class="lessons-sheet" hidden>
            <div id="lessons-sheet-backdrop" class="lessons-sheet-backdrop"></div>
            <section class="lessons-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="lessons-sheet-title">
                <button type="button" id="lessons-sheet-close" class="lessons-sheet-close" aria-label="Close" data-i18n-aria-label="common.close">&times;</button>
                <span id="lessons-sheet-kicker" class="lessons-sheet-kicker"></span>
                <h2 id="lessons-sheet-title" class="lessons-explanation-title"></h2>
                <div id="lessons-sheet-body" class="lessons-explanation-body"></div>
                <button type="button" id="lessons-sheet-start-btn" class="restart-btn" data-i18n="lessons.startBtn">Start lesson</button>
            </section>
        </div>
    </main>

    <!-- Review FAB: a fixed bottom-right button into a Sprint-style mixed run
         over the lessons already finished. Sits outside <main> as a sibling,
         same as #app-header/#app-bottom-nav below - <main>'s own page-enter
         animation (see body > main in style.css) makes it a containing block
         for any position:fixed descendant of its own for as long as that
         animation's fill-mode holds, which would pin a nested FAB to main's
         scrollable box instead of the viewport. Empty (and so invisible)
         until the first lesson is done - built in js/lessons.js
         (buildReviewFab). Hidden/shown by js/lessons.js alongside the path
         view since it's no longer inside it. -->
    <div id="lessons-review-slot"></div>

    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/virtual-keyboard.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="decks/lessons-norwegian.js"></script>
    <script src="decks/lessons-swedish.js"></script>
    <script src="decks/lessons-german.js"></script>
    <script src="decks/lessons-italian.js"></script>
    <script src="decks/lessons-chinese.js"></script>
    <script src="decks/lessons-japanese.js"></script>
    <script src="decks/lessons-spanish.js"></script>
    <script src="js/mission-celebrate.js"></script>
    <script src="js/streak-celebrate.js"></script>
    <script src="js/lessons.js"></script>
</body>
</html>
