<!DOCTYPE html>
<html lang="en" class="auth-document">
<head>
    <meta charset="UTF-8">
    <title data-i18n="auth.title">Sign in - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="auth-page-body">
  <main class="auth-page">
    <section id="auth-page" class="auth-panel" data-mode="signin" aria-label="Authentication form" data-i18n-aria-label="auth.form">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px">
        <div style="width:66px;height:66px;border-radius:20px;background:linear-gradient(160deg,#4d9fff,#2b7fe0);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:38px;color:#05203d;box-shadow:0 12px 30px -12px rgba(77, 159, 255,.6);margin-bottom:16px">P</div>
        <h2 id="auth-panel-title" style="font-family:var(--font-display);font-weight:600;font-size:24px;margin:0">Sign in</h2>
        <p id="auth-panel-copy" style="font-size:13px;font-weight:700;color:var(--text-soft);margin:6px 0 0">Access your saved progress and streaks.</p>
      </div>

      <form id="auth-form" class="auth-form auth-page-form">
        <label>
          <span data-i18n="auth.email">Email</span>
          <input id="auth-email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>
          <span data-i18n="auth.password">Password</span>
          <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <label id="auth-confirm-label" hidden>
          <span data-i18n="auth.confirmPassword">Confirm password</span>
          <input id="auth-confirm-password" type="password" autocomplete="new-password" minlength="6">
        </label>

        <button id="auth-submit-btn" class="restart-btn auth-submit" type="submit">Sign in</button>
        <p id="auth-status" class="auth-status" aria-live="polite"></p>
      </form>

      <div style="display:flex;align-items:center;gap:12px;margin:16px 0">
        <span style="flex:1;height:1px;background:var(--border)"></span>
        <span style="font-size:11px;font-weight:800;color:var(--text-faint)" data-i18n="auth.or">OR</span>
        <span style="flex:1;height:1px;background:var(--border)"></span>
      </div>

      <button id="auth-google-btn" type="button" style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:14px;padding:14px;font-family:var(--font-sans);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:20px">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        <span data-i18n="auth.continueWithGoogle">Continue with Google</span>
      </button>

      <p class="auth-switch" style="text-align:center">
        <span id="auth-switch-text">Don't have an account?</span>
        <button id="auth-switch-btn" class="auth-switch-btn" type="button">Register</button>
      </p>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/firebase-client.js"></script>
</body>
</html>
