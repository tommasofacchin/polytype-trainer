<!DOCTYPE html>
<html lang="en" class="memory-document">
<head>
    <meta charset="UTF-8">
    <title data-i18n="memory.title">Memory - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/norway.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        (function () {
            try {
                var t = localStorage.getItem("polytype-theme");
                if (!t) {
                    t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
    <style>
        html.memory-document,
        html.memory-document body {
            height: 100%;
            overflow: hidden;
        }

        .memory-page {
            width: min(100% - 28px, 880px);
            height: 100dvh;
            margin-inline: auto;
            padding-block: 14px;
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            overflow: hidden;
            --mem-front-a: #17c3d1;
            --mem-front-b: #6d28d9;
            --mem-confetti-1: var(--mem-front-a);
            --mem-confetti-2: var(--mem-front-b);
            --mem-confetti-3: #f472b6;
            --mem-confetti-4: #fbbf24;
            --mem-confetti-5: #34d399;
            --mem-confetti-6: #fb7185;
            --mem-mismatch-tint: color-mix(in srgb, var(--danger) 16%, var(--surface));
        }

        [data-theme="dark"] .memory-page {
            --mem-front-a: #22d3ee;
            --mem-front-b: #a78bfa;
            --mem-confetti-3: #f9a8d4;
            --mem-confetti-4: #fcd34d;
            --mem-confetti-6: #fca5a5;
        }

        .memory-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
        }

        .memory-topbar-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .sound-on-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .sound-off-icon {
            opacity: 0;
            transform: rotate(-18deg) scale(0.72);
        }

        #sfx-toggle[aria-pressed="true"] .sound-on-icon {
            opacity: 0;
            transform: rotate(18deg) scale(0.72);
        }

        #sfx-toggle[aria-pressed="true"] .sound-off-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .memory-head h1 {
            margin: 0;
            font-size: clamp(26px, 5vw, 34px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .memory-head p {
            margin: 4px 0 0;
            color: var(--text-soft);
            font-size: var(--text-sm);
        }

        /* ── HUD ─────────────────────────────────────────────── */
        .memory-hud {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--space-3);
        }

        .memory-hud[hidden] { display: none; }

        .mem-hud-item {
            display: grid;
            gap: 2px;
            padding: 12px 14px;
        }

        .mem-hud-label {
            color: var(--text-faint);
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .mem-hud-item strong {
            color: var(--text);
            font-size: var(--text-xl);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        /* ── Board ───────────────────────────────────────────── */
        /* The board takes the leftover height and is a size container, so the
           grid can size square cards that always fit -> no page scroll. */
        .memory-board {
            position: relative;
            flex: 1;
            min-height: 0;
            container-type: size;
            display: grid;
            place-items: center;
        }

        /* ── Combo pill (floating, doesn't perturb the board's container-query sizing) ── */
        .mem-combo-pill {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%) translateY(0) scale(1);
            z-index: 5;
            display: flex;
            align-items: baseline;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 700;
            font-size: var(--text-sm);
            box-shadow: var(--shadow-sm);
            transition: background var(--transition), color var(--transition);
        }

        .mem-combo-pill[hidden] { display: none; }

        .mem-combo-pill-label {
            font-size: var(--text-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.85;
        }

        .mem-combo-pill[data-tier="2"] { background: var(--combo-2-soft); color: var(--combo-2); }
        .mem-combo-pill[data-tier="3"] { background: var(--combo-3-soft); color: var(--combo-3); }
        .mem-combo-pill[data-tier="4"] { background: var(--combo-4-soft); color: var(--combo-4); }

        @keyframes mem-combo-pulse {
            0%   { transform: translateX(-50%) scale(1); }
            35%  { transform: translateX(-50%) scale(1.16); }
            100% { transform: translateX(-50%) scale(1); }
        }

        @keyframes mem-combo-pulse-big {
            0%   { transform: translateX(-50%) scale(1); }
            30%  { transform: translateX(-50%) scale(1.32); }
            55%  { transform: translateX(-50%) scale(0.94); }
            100% { transform: translateX(-50%) scale(1); }
        }

        @keyframes mem-combo-break {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            20%       { transform: translateX(-50%) translateY(-2px) rotate(-3deg); }
            45%       { transform: translateX(-50%) translateY(1px) rotate(3deg); }
            65%       { transform: translateX(-50%) translateY(-1px) rotate(-2deg); }
            85%       { transform: translateX(-50%) translateY(1px) rotate(2deg); }
        }

        .mem-combo-pill.mem-combo-pop     { animation: mem-combo-pulse     240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
        .mem-combo-pill.mem-combo-pop-big { animation: mem-combo-pulse-big 320ms cubic-bezier(0.2, 0.8, 0.2, 1); }
        .mem-combo-pill.mem-combo-shake   { animation: mem-combo-break     300ms ease-out; }

        /* ── Match / victory confetti ───────────────────────────── */
        .mem-confetti-burst {
            position: fixed;
            inset: 0;
            z-index: 260;
            overflow: hidden;
            pointer-events: none;
        }

        .mem-confetti-piece {
            position: absolute;
            width: 7px;
            height: 11px;
            border-radius: 2px;
            opacity: 0;
            animation: mem-confetti-pop var(--dur, 0.6s) cubic-bezier(0.2, 0.7, 0.3, 1) var(--delay, 0s) forwards;
        }

        @keyframes mem-confetti-pop {
            0%   { opacity: 0; transform: translate(0, 0) rotate(0); }
            10%  { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--x, 0), var(--y, 60px)) rotate(var(--r, 260deg)); }
        }

        .mem-xp-float {
            position: fixed;
            pointer-events: none;
            z-index: 260;
            font-size: var(--text-sm);
            font-weight: 700;
            color: var(--accent);
            animation: mem-xp-float 700ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .mem-xp-float[data-tier="2"] { color: var(--combo-2); }
        .mem-xp-float[data-tier="3"] { color: var(--combo-3); }
        .mem-xp-float[data-tier="4"] { color: var(--combo-4); }

        @keyframes mem-xp-float {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            18%  { opacity: 1; transform: translateY(-10px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-46px) scale(0.88); }
        }

        .memory-grid {
            --gap: 10px;
            /* Cards are portrait, like a normal playing card (height ≈ 1.4 × width). */
            --ratio: 1.4;
            display: grid;
            gap: var(--gap);
            justify-content: center;
            align-content: center;
            /* Largest portrait card (at --ratio) that fits both width and height. */
            --card-w: min(
                (100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols),
                ((100cqh - (var(--rows) - 1) * var(--gap)) / var(--rows)) / var(--ratio)
            );
            --card-h: calc(var(--card-w) * var(--ratio));
            grid-template-columns: repeat(var(--cols), var(--card-w));
            grid-template-rows: repeat(var(--rows), var(--card-h));
        }

        /* Desktop card grids: Easy 4x3, Medium 5x4, Hard 6x5 (inverse of mobile). */
        .memory-grid[data-pairs="6"]  { --cols: 4; --rows: 3; }
        .memory-grid[data-pairs="10"] { --cols: 5; --rows: 4; }
        .memory-grid[data-pairs="15"] { --cols: 6; --rows: 5; }

        .memory-empty {
            grid-column: 1 / -1;
            padding: 32px 16px;
            text-align: center;
            color: var(--text-soft);
            line-height: 1.6;
        }

        .memory-empty code {
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            font-size: 0.92em;
        }

        /* ── Card ────────────────────────────────────────────── */
        .mem-card {
            appearance: none;
            border: 0;
            padding: 0;
            background: transparent;
            min-width: 0;
            min-height: 0;
            cursor: pointer;
            perspective: 900px;
            animation: mem-card-idle 3.6s ease-in-out infinite;
            animation-delay: var(--idle-delay, 0s);
        }

        .mem-card:disabled { cursor: default; }

        .mem-card.is-flipped,
        .mem-card.is-matched,
        .mem-card:disabled {
            animation: none;
        }

        .mem-card.is-mismatch {
            animation: mem-mismatch-shake 320ms ease-out;
        }

        @keyframes mem-card-idle {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-3px); }
        }

        @keyframes mem-mismatch-shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            45%       { transform: translateX(6px); }
            65%       { transform: translateX(-3px); }
            85%       { transform: translateX(3px); }
        }

        .mem-card-inner {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .mem-card.is-flipped .mem-card-inner,
        .mem-card.is-matched .mem-card-inner {
            transform: rotateY(180deg);
        }

        .mem-card-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 6px;
            border-radius: var(--radius-md);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            text-align: center;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.2;
        }

        .mem-card-front {
            overflow: hidden;
            background:
                radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.4), transparent 46%),
                linear-gradient(155deg, var(--mem-front-a), var(--mem-front-b));
            color: var(--text-inverse);
            font-size: 26px;
            font-weight: 800;
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        .mem-card-front::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 46%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.32);
            box-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.3),
                inset 0 -4px 8px rgba(0, 0, 0, 0.14);
        }

        .mem-card-front::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 -14px 22px rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }

        .mem-card-back {
            transform: rotateY(180deg);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        .mem-card.is-mismatch .mem-card-back {
            background: var(--mem-mismatch-tint);
            border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
            color: var(--danger);
        }

        /* Plain wrapper (not part of the 3D flip) used as the size container
           so the word font and flag can scale with the card width. */
        .mem-card-content {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 6px;
            container-type: inline-size;
        }

        .mem-card-word {
            max-width: 100%;
            font-weight: 700;
            line-height: 1.04;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .mem-card[data-type="meaning"] .mem-card-word {
            color: var(--text-soft);
            font-weight: 500;
            font-style: italic;
        }

        .mem-card-flag {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(20px, 30cqw, 42px);
            height: auto;
            border-radius: 3px;
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 12%, transparent);
        }

        .mem-card.is-matched .mem-card-back {
            border-color: color-mix(in srgb, var(--success) 55%, var(--border));
            background: color-mix(in srgb, var(--success) 14%, var(--surface));
            color: var(--success);
            animation: mem-match-pop 360ms ease;
        }

        @keyframes mem-match-pop {
            0%   { transform: rotateY(180deg) scale(1); }
            45%  { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* ── Overlays (difficulty + result) ──────────────────── */
        .mem-overlay {
            position: fixed;
            inset: 0;
            z-index: 250;
            display: grid;
            place-items: center;
            padding: clamp(16px, 4vw, 32px);
        }

        .mem-overlay[hidden] { display: none; }

        .mem-overlay-backdrop {
            position: absolute;
            inset: 0;
            background: var(--scrim);
        }

        .mem-overlay-card {
            position: relative;
            overflow: hidden;
            width: min(100%, 560px);
            padding: clamp(20px, 4vw, 30px);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .mem-overlay-card.is-victory {
            animation: mem-victory-pop 520ms cubic-bezier(0.18, 1.2, 0.32, 1) both;
        }

        @keyframes mem-victory-pop {
            0%   { opacity: 0; transform: scale(0.7) translateY(10px); }
            60%  { opacity: 1; }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .mem-victory-confetti {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: inherit;
            pointer-events: none;
        }

        .mem-victory-confetti .mem-confetti-piece {
            top: 6%;
            animation-name: mem-victory-confetti-fall;
        }

        @keyframes mem-victory-confetti-fall {
            0%   { opacity: 0; transform: translate(0, 0) rotate(0); }
            10%  { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--x, 0), var(--fall, 180px)) rotate(var(--r, 360deg)); }
        }

        .mem-overlay-kicker {
            display: block;
            color: var(--text-faint);
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .mem-overlay-card h2 {
            margin: 6px 0 0;
            font-size: clamp(22px, 4vw, 28px);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .mem-overlay-sub {
            margin: 6px 0 0;
            color: var(--text-soft);
            font-size: var(--text-sm);
        }

        .mem-difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--space-3);
            margin-top: var(--space-5);
        }

        .mem-diff-btn {
            position: relative;
            appearance: none;
            display: grid;
            gap: 4px;
            padding: 16px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--surface-soft);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            transition: border-color var(--transition), background var(--transition), transform var(--transition);
        }

        .mem-diff-btn:not(.is-locked):hover,
        .mem-diff-btn:not(.is-locked):focus-visible {
            border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
            background: var(--surface);
            outline: 0;
        }

        .mem-diff-btn:not(.is-locked):active { transform: translateY(1px); }

        .mem-diff-btn.is-locked {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .mem-diff-lock {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--text-faint);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: none;
        }

        .mem-diff-btn.is-locked .mem-diff-lock { display: block; }

        .mem-diff-name {
            font-size: var(--text-md);
            font-weight: 700;
        }

        .mem-diff-meta {
            color: var(--text-faint);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .mem-diff-dots {
            margin-top: 2px;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .mem-result-score {
            display: block;
            margin-top: var(--space-4);
            font-size: clamp(40px, 9vw, 56px);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--accent);
            line-height: 1;
        }

        .mem-result-detail {
            display: block;
            margin-top: var(--space-2);
            color: var(--text-soft);
            font-size: var(--text-sm);
        }

        .mem-result-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-2);
            margin-top: var(--space-5);
        }

        #play-again-btn { grid-column: 1 / -1; }

        #home-btn { text-decoration: none; }

        /* ── Mobile ──────────────────────────────────────────── */
        @media (max-width: 600px) {
            .memory-page {
                width: 100%;
                padding: 12px 12px 32px;
                gap: var(--space-3);
            }

            .memory-grid {
                --gap: 8px;
                /* Keep phone cards square so more fit per row. */
                --ratio: 1;
            }

            /* Phone card grids: Easy 3x4, Medium 4x5, Hard 5x6. */
            .memory-grid[data-pairs="6"]  { --cols: 3; --rows: 4; }
            .memory-grid[data-pairs="10"] { --cols: 4; --rows: 5; }
            .memory-grid[data-pairs="15"] { --cols: 5; --rows: 6; }

            .mem-hud-item {
                padding: 8px 10px;
            }

            .mem-hud-item strong {
                font-size: var(--text-lg);
            }

            .mem-card-front { font-size: 22px; }

            .mem-difficulty-grid {
                grid-template-columns: 1fr;
                gap: var(--space-2);
            }

            .mem-diff-btn {
                grid-template-columns: auto auto;
                justify-content: space-between;
                align-items: center;
                text-align: left;
                padding: 14px;
            }

            .mem-diff-dots { grid-column: 1 / -1; }
        }

        @media (prefers-reduced-motion: reduce) {
            /* The flip is essential game feedback, so keep a short version even
               with reduced motion; only decorative motion is dropped. Color-state
               feedback (mismatch red / matched green) stays since it's instant,
               not motion. */
            .mem-card-inner { transition: transform 0.2s ease; }
            .mem-card.is-matched .mem-card-back { animation: none; }
            .mem-card { animation: none !important; }
            .mem-combo-pill { animation: none !important; }
            .mem-confetti-piece,
            .mem-victory-confetti { display: none; }
            .mem-overlay-card.is-victory { animation: mem-victory-fade 200ms ease both; }
        }

        @keyframes mem-victory-fade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body class="profile-page-body">
    <main class="memory-page">
        <nav class="memory-topbar" aria-label="Memory navigation" data-i18n-aria-label="memory.navigation">
            <a class="back-link" href="index.html" aria-label="Back to trainer" data-i18n-aria-label="profile.back">
                <span aria-hidden="true">&larr;</span>
                <span data-i18n="common.trainer">Trainer</span>
            </a>
            <div class="memory-topbar-actions">
                <button id="sfx-toggle" class="theme-icon-toggle" type="button" aria-label="Mute sound effects" data-i18n-aria-label="memory.muteSound" aria-pressed="false">
                    <svg class="theme-icon mem-sfx-icon sound-on-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 5V4L8 9H4Z"></path>
                        <path d="M17 8a5 5 0 0 1 0 8"></path>
                        <path d="M19.5 5.5a9 9 0 0 1 0 13"></path>
                    </svg>
                    <svg class="theme-icon mem-sfx-icon sound-off-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 5V4L8 9H4Z"></path>
                        <path d="m17 9 5 6"></path>
                        <path d="m22 9-5 6"></path>
                    </svg>
                </button>
                <button id="theme-toggle" class="theme-icon-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                    <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path><path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path><path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                    <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 14.4A7.8 7.8 0 0 1 9.6 4 8 8 0 1 0 20 14.4Z"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <header class="memory-head">
            <h1 id="memory-heading">Memory</h1>
            <p id="memory-subtitle">Match each word with its translation.</p>
        </header>

        <section id="memory-hud" class="memory-hud" aria-label="Game status" data-i18n-aria-label="memory.status" hidden>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="trainer.time">Time</span>
                <strong id="hud-time">0:00</strong>
            </div>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="memory.moves">Moves</span>
                <strong id="hud-moves">0</strong>
            </div>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="memory.pairs">Pairs</span>
                <strong id="hud-pairs">0 / 0</strong>
            </div>
        </section>

        <div id="memory-board" class="memory-board" aria-label="Memory board" data-i18n-aria-label="memory.board">
            <div id="combo-pill" class="mem-combo-pill" role="status" hidden>
                <span class="mem-combo-pill-label" data-i18n="memory.combo">Combo</span>
                <span id="combo-pill-value">&times;1</span>
            </div>
            <div id="memory-grid" class="memory-grid"></div>
        </div>
    </main>

    <div id="difficulty-modal" class="mem-overlay" role="dialog" aria-modal="true" aria-labelledby="difficulty-title" hidden>
        <div class="mem-overlay-backdrop"></div>
        <div class="mem-overlay-card">
            <span class="mem-overlay-kicker" data-i18n="trainer.memory">Memory</span>
            <h2 id="difficulty-title" data-i18n="memory.chooseDifficulty">Choose a difficulty</h2>
            <p id="difficulty-sub" class="mem-overlay-sub" data-i18n="memory.difficultySub">Higher difficulty = more cards and more points.</p>
            <div class="mem-difficulty-grid">
                <button class="mem-diff-btn" type="button" data-difficulty="easy">
                    <span class="mem-diff-name" data-i18n="memory.easy">Easy</span>
                    <span class="mem-diff-meta">5 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9675;&#9675;</span>
                </button>
                <button class="mem-diff-btn" type="button" data-difficulty="medium">
                    <span class="mem-diff-name" data-i18n="memory.medium">Medium</span>
                    <span class="mem-diff-meta">10 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9679;&#9675;</span>
                    <svg class="mem-diff-lock" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </button>
                <button class="mem-diff-btn" type="button" data-difficulty="hard">
                    <span class="mem-diff-name" data-i18n="memory.hard">Hard</span>
                    <span class="mem-diff-meta">15 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9679;&#9679;</span>
                    <svg class="mem-diff-lock" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="mem-overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
        <div class="mem-overlay-backdrop"></div>
        <div class="mem-overlay-card">
            <span class="mem-overlay-kicker" data-i18n="memory.cleared">Cleared!</span>
            <h2 id="result-title" data-i18n="memory.wellDone">Well done</h2>
            <strong id="result-score" class="mem-result-score">0 pts</strong>
            <span id="result-detail" class="mem-result-detail">&mdash;</span>
            <span id="result-combo" class="mem-result-detail" hidden>&mdash;</span>
            <span id="result-perfect" class="mem-result-detail" hidden data-i18n="memory.perfectClear">Perfect clear &mdash; no misses!</span>
            <div class="mem-result-actions">
                <button id="play-again-btn" class="restart-btn" type="button" data-i18n="trainer.playAgain">Play again</button>
                <button id="change-difficulty-btn" class="theme-toggle" type="button" data-i18n="memory.changeDifficulty">Change difficulty</button>
                <a id="home-btn" class="theme-toggle" href="index.html" data-i18n="common.home">Home</a>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="decks/index.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
