<!DOCTYPE html>
<html lang="en" class="memory-document">
<head>
    <meta charset="UTF-8">
    <title data-i18n="memory.title">Memory - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/norway.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        (function () {
            try {
                var t = localStorage.getItem("polytype-theme");
                if (!t) {
                    t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
    <style>
        html.memory-document,
        html.memory-document body {
            height: 100%;
            overflow: hidden;
        }

        .memory-page {
            width: min(100% - 28px, 880px);
            height: 100dvh;
            margin-inline: auto;
            padding-block: 14px;
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            overflow: hidden;
        }

        .memory-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
        }

        .memory-head h1 {
            margin: 0;
            font-size: clamp(26px, 5vw, 34px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .memory-head p {
            margin: 4px 0 0;
            color: var(--text-soft);
            font-size: var(--text-sm);
        }

        /* ── HUD ─────────────────────────────────────────────── */
        .memory-hud {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--space-3);
        }

        .memory-hud[hidden] { display: none; }

        .mem-hud-item {
            display: grid;
            gap: 2px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: color-mix(in srgb, var(--surface) 86%, var(--bg-soft));
            box-shadow: var(--shadow-sm);
        }

        .mem-hud-label {
            color: var(--text-faint);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .mem-hud-item strong {
            color: var(--text);
            font-size: var(--text-xl);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        /* ── Board ───────────────────────────────────────────── */
        /* The board takes the leftover height and is a size container, so the
           grid can size square cards that always fit -> no page scroll. */
        .memory-board {
            flex: 1;
            min-height: 0;
            container-type: size;
            display: grid;
            place-items: center;
        }

        .memory-grid {
            --gap: 10px;
            /* Cards are portrait, like a normal playing card (height ≈ 1.4 × width). */
            --ratio: 1.4;
            display: grid;
            gap: var(--gap);
            justify-content: center;
            align-content: center;
            /* Largest portrait card (at --ratio) that fits both width and height. */
            --card-w: min(
                (100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols),
                ((100cqh - (var(--rows) - 1) * var(--gap)) / var(--rows)) / var(--ratio)
            );
            --card-h: calc(var(--card-w) * var(--ratio));
            grid-template-columns: repeat(var(--cols), var(--card-w));
            grid-template-rows: repeat(var(--rows), var(--card-h));
        }

        /* Desktop card grids: Easy 5x2, Medium 5x4, Hard 6x5. */
        .memory-grid[data-pairs="5"]  { --cols: 5; --rows: 2; }
        .memory-grid[data-pairs="10"] { --cols: 5; --rows: 4; }
        .memory-grid[data-pairs="15"] { --cols: 6; --rows: 5; }

        .memory-empty {
            grid-column: 1 / -1;
            padding: 32px 16px;
            text-align: center;
            color: var(--text-soft);
            line-height: 1.6;
        }

        .memory-empty code {
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            font-size: 0.92em;
        }

        /* ── Card ────────────────────────────────────────────── */
        .mem-card {
            appearance: none;
            border: 0;
            padding: 0;
            background: transparent;
            min-width: 0;
            min-height: 0;
            cursor: pointer;
            perspective: 900px;
        }

        .mem-card:disabled { cursor: default; }

        .mem-card-inner {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .mem-card.is-flipped .mem-card-inner,
        .mem-card.is-matched .mem-card-inner {
            transform: rotateY(180deg);
        }

        .mem-card-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 6px;
            border-radius: var(--radius-md);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            text-align: center;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.2;
        }

        .mem-card-front {
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ffffff));
            color: var(--text-inverse);
            font-size: 26px;
            font-weight: 700;
            box-shadow: var(--shadow-sm);
        }

        .mem-card-back {
            transform: rotateY(180deg);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }

        /* Plain wrapper (not part of the 3D flip) used as the size container
           so the word font and flag can scale with the card width. */
        .mem-card-content {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 6px;
            container-type: inline-size;
        }

        .mem-card-word {
            max-width: 100%;
            font-weight: 700;
            line-height: 1.04;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .mem-card[data-type="meaning"] .mem-card-word {
            color: var(--text-soft);
            font-weight: 500;
            font-style: italic;
        }

        .mem-card-flag {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(20px, 30cqw, 42px);
            height: auto;
            border-radius: 3px;
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 12%, transparent);
        }

        .mem-card.is-matched .mem-card-back {
            border-color: color-mix(in srgb, var(--success) 55%, var(--border));
            background: color-mix(in srgb, var(--success) 14%, var(--surface));
            color: var(--success);
            animation: mem-match-pop 360ms ease;
        }

        @keyframes mem-match-pop {
            0%   { transform: rotateY(180deg) scale(1); }
            45%  { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* ── Overlays (difficulty + result) ──────────────────── */
        .mem-overlay {
            position: fixed;
            inset: 0;
            z-index: 250;
            display: grid;
            place-items: center;
            padding: clamp(16px, 4vw, 32px);
        }

        .mem-overlay[hidden] { display: none; }

        .mem-overlay-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(9, 23, 23, 0.66);
        }

        .mem-overlay-card {
            position: relative;
            width: min(100%, 560px);
            padding: clamp(20px, 4vw, 30px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .mem-overlay-kicker {
            display: block;
            color: var(--text-faint);
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .mem-overlay-card h2 {
            margin: 6px 0 0;
            font-size: clamp(22px, 4vw, 28px);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .mem-overlay-sub {
            margin: 6px 0 0;
            color: var(--text-soft);
            font-size: var(--text-sm);
        }

        .mem-difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--space-3);
            margin-top: var(--space-5);
        }

        .mem-diff-btn {
            position: relative;
            appearance: none;
            display: grid;
            gap: 4px;
            padding: 16px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--surface-soft);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            transition: border-color var(--transition), background var(--transition), transform var(--transition);
        }

        .mem-diff-btn:not(.is-locked):hover,
        .mem-diff-btn:not(.is-locked):focus-visible {
            border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
            background: var(--surface);
            outline: 0;
        }

        .mem-diff-btn:not(.is-locked):active { transform: translateY(1px); }

        .mem-diff-btn.is-locked {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .mem-diff-lock {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--text-faint);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: none;
        }

        .mem-diff-btn.is-locked .mem-diff-lock { display: block; }

        .mem-diff-name {
            font-size: var(--text-md);
            font-weight: 700;
        }

        .mem-diff-meta {
            color: var(--text-faint);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .mem-diff-dots {
            margin-top: 2px;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .mem-result-score {
            display: block;
            margin-top: var(--space-4);
            font-size: clamp(40px, 9vw, 56px);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--accent);
            line-height: 1;
        }

        .mem-result-detail {
            display: block;
            margin-top: var(--space-2);
            color: var(--text-soft);
            font-size: var(--text-sm);
        }

        .mem-result-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-2);
            margin-top: var(--space-5);
        }

        #play-again-btn { grid-column: 1 / -1; }

        #home-btn { text-decoration: none; }

        /* ── Mobile ──────────────────────────────────────────── */
        @media (max-width: 600px) {
            .memory-page {
                width: 100%;
                padding: 12px 12px 32px;
                gap: var(--space-3);
            }

            .memory-grid {
                --gap: 8px;
                /* Keep phone cards square so more fit per row. */
                --ratio: 1;
            }

            /* Phone card grids: Easy 3x4 (last card centered), Medium 4x5,
               Hard 5x6. */
            .memory-grid[data-pairs="5"]  { --cols: 3; --rows: 4; }
            .memory-grid[data-pairs="10"] { --cols: 4; --rows: 5; }
            .memory-grid[data-pairs="15"] { --cols: 5; --rows: 6; }

            .memory-grid[data-pairs="5"] .mem-card:last-child {
                grid-column: 2;
            }

            .mem-hud-item {
                padding: 8px 10px;
            }

            .mem-hud-item strong {
                font-size: var(--text-lg);
            }

            .mem-card-front { font-size: 22px; }

            .mem-difficulty-grid {
                grid-template-columns: 1fr;
                gap: var(--space-2);
            }

            .mem-diff-btn {
                grid-template-columns: auto auto;
                justify-content: space-between;
                align-items: center;
                text-align: left;
                padding: 14px;
            }

            .mem-diff-dots { grid-column: 1 / -1; }
        }

        @media (prefers-reduced-motion: reduce) {
            /* The flip is essential game feedback, so keep a short version even
               with reduced motion; only the decorative match "pop" is dropped. */
            .mem-card-inner { transition: transform 0.2s ease; }
            .mem-card.is-matched .mem-card-back { animation: none; }
        }
    </style>
</head>
<body class="profile-page-body">
    <main class="memory-page">
        <nav class="memory-topbar" aria-label="Memory navigation" data-i18n-aria-label="memory.navigation">
            <a class="back-link" href="index.html" aria-label="Back to trainer" data-i18n-aria-label="profile.back">
                <span aria-hidden="true">&larr;</span>
                <span data-i18n="common.trainer">Trainer</span>
            </a>
            <button id="theme-toggle" class="theme-icon-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path><path d="M12 20v2"></path>
                    <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
                    <path d="M2 12h2"></path><path d="M20 12h2"></path>
                    <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
                <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.4A7.8 7.8 0 0 1 9.6 4 8 8 0 1 0 20 14.4Z"></path>
                </svg>
            </button>
        </nav>

        <header class="memory-head">
            <h1 id="memory-heading">Memory</h1>
            <p id="memory-subtitle">Match each word with its translation.</p>
        </header>

        <section id="memory-hud" class="memory-hud" aria-label="Game status" data-i18n-aria-label="memory.status" hidden>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="trainer.time">Time</span>
                <strong id="hud-time">0:00</strong>
            </div>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="memory.moves">Moves</span>
                <strong id="hud-moves">0</strong>
            </div>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="memory.pairs">Pairs</span>
                <strong id="hud-pairs">0 / 0</strong>
            </div>
        </section>

        <div id="memory-board" class="memory-board" aria-label="Memory board" data-i18n-aria-label="memory.board">
            <div id="memory-grid" class="memory-grid"></div>
        </div>
    </main>

    <div id="difficulty-modal" class="mem-overlay" role="dialog" aria-modal="true" aria-labelledby="difficulty-title" hidden>
        <div class="mem-overlay-backdrop"></div>
        <div class="mem-overlay-card">
            <span class="mem-overlay-kicker" data-i18n="trainer.memory">Memory</span>
            <h2 id="difficulty-title" data-i18n="memory.chooseDifficulty">Choose a difficulty</h2>
            <p id="difficulty-sub" class="mem-overlay-sub" data-i18n="memory.difficultySub">Higher difficulty = more cards and more points.</p>
            <div class="mem-difficulty-grid">
                <button class="mem-diff-btn" type="button" data-difficulty="easy">
                    <span class="mem-diff-name" data-i18n="memory.easy">Easy</span>
                    <span class="mem-diff-meta">5 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9675;&#9675;</span>
                </button>
                <button class="mem-diff-btn" type="button" data-difficulty="medium">
                    <span class="mem-diff-name" data-i18n="memory.medium">Medium</span>
                    <span class="mem-diff-meta">10 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9679;&#9675;</span>
                    <svg class="mem-diff-lock" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </button>
                <button class="mem-diff-btn" type="button" data-difficulty="hard">
                    <span class="mem-diff-name" data-i18n="memory.hard">Hard</span>
                    <span class="mem-diff-meta">15 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9679;&#9679;</span>
                    <svg class="mem-diff-lock" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="mem-overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
        <div class="mem-overlay-backdrop"></div>
        <div class="mem-overlay-card">
            <span class="mem-overlay-kicker" data-i18n="memory.cleared">Cleared!</span>
            <h2 id="result-title" data-i18n="memory.wellDone">Well done</h2>
            <strong id="result-score" class="mem-result-score">0 pts</strong>
            <span id="result-detail" class="mem-result-detail">&mdash;</span>
            <div class="mem-result-actions">
                <button id="play-again-btn" class="restart-btn" type="button" data-i18n="trainer.playAgain">Play again</button>
                <button id="change-difficulty-btn" class="theme-toggle" type="button" data-i18n="memory.changeDifficulty">Change difficulty</button>
                <a id="home-btn" class="theme-toggle" href="index.html" data-i18n="common.home">Home</a>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="decks/index.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
