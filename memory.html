<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="memory.title">Memory - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/norway.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-fixed-page" data-tab="games">
    <div id="app-header"></div>
    <main class="memory-page">
        <nav class="memory-topbar" aria-label="Memory navigation" data-i18n-aria-label="memory.navigation">
            <a class="back-link-mini" href="games.html">&lsaquo; <span data-i18n="nav.games">Games</span></a>
            <div class="memory-topbar-actions">
                <button id="sfx-toggle" class="theme-icon-toggle" type="button" aria-label="Mute sound effects" data-i18n-aria-label="memory.muteSound" aria-pressed="false">
                    <svg class="theme-icon mem-sfx-icon sound-on-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 5V4L8 9H4Z"></path>
                        <path d="M17 8a5 5 0 0 1 0 8"></path>
                        <path d="M19.5 5.5a9 9 0 0 1 0 13"></path>
                    </svg>
                    <svg class="theme-icon mem-sfx-icon sound-off-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 5V4L8 9H4Z"></path>
                        <path d="m17 9 5 6"></path>
                        <path d="m22 9-5 6"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <header class="memory-head">
            <h1 id="memory-heading">Memory</h1>
            <p id="memory-subtitle">Match each word with its translation.</p>
        </header>

        <section id="memory-hud" class="memory-hud" aria-label="Game status" data-i18n-aria-label="memory.status" hidden>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="trainer.time">Time</span>
                <strong id="hud-time">0:00</strong>
            </div>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="memory.moves">Moves</span>
                <strong id="hud-moves">0</strong>
            </div>
            <div class="mem-hud-item">
                <span class="mem-hud-label" data-i18n="memory.pairs">Pairs</span>
                <strong id="hud-pairs">0 / 0</strong>
            </div>
        </section>

        <div id="memory-board" class="memory-board" aria-label="Memory board" data-i18n-aria-label="memory.board">
            <div id="combo-pill" class="mem-combo-pill" role="status" hidden>
                <span class="mem-combo-pill-label" data-i18n="memory.combo">Combo</span>
                <span id="combo-pill-value">&times;1</span>
            </div>
            <div id="memory-grid" class="memory-grid">
                <div class="game-loading-screen">
                    <div class="game-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                    <p class="game-loading-text" data-i18n="common.loadingWords">Loading your words...</p>
                </div>
            </div>
        </div>
    </main>
    <div id="app-bottom-nav"></div>

    <div id="difficulty-modal" class="mem-overlay" role="dialog" aria-modal="true" aria-labelledby="difficulty-title" hidden>
        <div class="mem-overlay-backdrop"></div>
        <div class="mem-overlay-card">
            <span class="mem-overlay-kicker" data-i18n="trainer.memory">Memory</span>
            <h2 id="difficulty-title" data-i18n="memory.chooseDifficulty">Choose a difficulty</h2>
            <p id="difficulty-sub" class="mem-overlay-sub" data-i18n="memory.difficultySub">Higher difficulty = more cards and more points.</p>
            <div class="mem-difficulty-grid">
                <button class="mem-diff-btn" type="button" data-difficulty="easy">
                    <span class="mem-diff-name" data-i18n="memory.easy">Easy</span>
                    <span class="mem-diff-meta">5 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9675;&#9675;</span>
                </button>
                <button class="mem-diff-btn" type="button" data-difficulty="medium">
                    <span class="mem-diff-name" data-i18n="memory.medium">Medium</span>
                    <span class="mem-diff-meta">10 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9679;&#9675;</span>
                    <svg class="mem-diff-lock" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </button>
                <button class="mem-diff-btn" type="button" data-difficulty="hard">
                    <span class="mem-diff-name" data-i18n="memory.hard">Hard</span>
                    <span class="mem-diff-meta">15 pairs</span>
                    <span class="mem-diff-dots" aria-hidden="true">&#9679;&#9679;&#9679;</span>
                    <svg class="mem-diff-lock" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="game-result-overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
        <div class="mem-overlay-backdrop"></div>
        <div class="mem-overlay-card">
            <span class="mem-overlay-kicker" data-i18n="memory.cleared">Cleared!</span>
            <h2 id="result-title" data-i18n="memory.wellDone">Well done</h2>
            <strong id="result-score" class="mem-result-score">0 pts</strong>
            <span id="result-detail" class="mem-result-detail">&mdash;</span>
            <span id="result-combo" class="mem-result-detail" hidden>&mdash;</span>
            <span id="result-perfect" class="mem-result-detail" hidden data-i18n="memory.perfectClear">Perfect clear &mdash; no misses!</span>
            <span id="result-coins" class="result-coins-text"></span>
            <span id="result-save-status" class="mem-result-detail" aria-live="polite"></span>
            <div class="mem-result-actions">
                <button id="play-again-btn" class="restart-btn" type="button" data-i18n="trainer.playAgain">Play again</button>
                <button id="change-difficulty-btn" class="theme-toggle" type="button" data-i18n="memory.changeDifficulty">Change difficulty</button>
                <a id="games-btn" class="restart-btn is-secondary" href="games.html" data-i18n="nav.games">Games</a>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/virtual-keyboard.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="decks/index.js"></script>
    <script src="decks/categories.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="js/mission-celebrate.js"></script>
    <script src="js/streak-celebrate.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
