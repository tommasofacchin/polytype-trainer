<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="trainer.pageTitle">Trainer - Polytype Trainer</title>
  <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-fixed-page" data-tab="games">
  <div id="app-header"></div>
  <main class="app">
    <section class="game-hud" aria-label="Session score" data-i18n-aria-label="trainer.sessionScore">
      <div class="hud-item">
        <span class="hud-label" data-i18n="trainer.time">Time</span>
        <strong id="timer-text">Free</strong>
      </div>
      <div class="hud-item">
        <span class="hud-label" data-i18n="trainer.score">Score</span>
        <strong id="hud-score-text">0 pts</strong>
      </div>
      <div class="hud-item" id="streak-hud">
        <span class="hud-label" data-i18n="trainer.combo">Combo</span>
        <div class="streak-display">
          <strong id="streak-text">0</strong>
          <span id="streak-chip" class="streak-chip" hidden></span>
        </div>
      </div>
    </section>

    <section class="list-card" aria-label="Vocabulary drill" data-i18n-aria-label="trainer.vocabularyDrill">
      <div class="list-header">
        <span class="col-script" data-i18n="trainer.word">Word</span>
        <span class="col-meaning" data-i18n="trainer.meaning">Meaning</span>
      </div>

      <div id="rows-container"></div>

      <div id="timer-result-modal" class="timer-modal" role="dialog" aria-modal="true" hidden>
        <div class="timer-modal-backdrop"></div>
        <div class="timer-modal-card">
          <span class="result-label" data-i18n="trainer.timeUp">Time up</span>
          <strong id="timed-result-score" class="result-score-text">0 pts</strong>
          <span id="timed-result-detail" class="result-detail-text">0 correct / 0 fields</span>
          <span id="timed-result-coins" class="result-coins-text"></span>
          <span id="timed-result-save-status" class="result-save-status"></span>
          <button id="timed-play-again-btn" class="restart-btn" type="button" data-i18n="trainer.playAgain">Play again</button>
        </div>
      </div>
    </section>

    <section id="session-result" class="session-result" aria-live="polite" hidden>
      <div>
        <span class="result-label" data-i18n="trainer.timeUp">Time up</span>
        <strong id="result-score">0 pts</strong>
        <span id="result-detail">0 correct / 0 fields</span>
        <span id="result-save-status" class="result-save-status"></span>
      </div>
      <button id="play-again-btn" class="restart-btn" type="button" data-i18n="trainer.playAgain">Play again</button>
    </section>
  </main>
  <div id="app-bottom-nav"></div>

  <div id="trainer-start-gate" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="trainer-gate-title" hidden>
    <div class="confirm-overlay-backdrop"></div>
    <div class="confirm-card" role="document">
      <h2 id="trainer-gate-title" data-i18n="trainer.chooseTimeTitle">How long do you want to play?</h2>
      <p class="confirm-card-body" data-i18n="trainer.chooseTimeBody">Pick a session length to start.</p>
      <div class="trainer-duration-grid">
        <button type="button" class="trainer-duration-btn" data-gate-seconds="30" data-i18n="trainer.duration30s">30 sec</button>
        <button type="button" class="trainer-duration-btn" data-gate-seconds="120" data-i18n="trainer.duration2m">2 min</button>
        <button type="button" class="trainer-duration-btn" data-gate-seconds="300" data-i18n="trainer.duration5m">5 min</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="js/gamestate.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/mission-celebrate.js"></script>
  <script src="decks/index.js"></script>
  <script src="decks/categories.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
