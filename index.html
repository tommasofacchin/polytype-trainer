<!DOCTYPE html>
<html lang="en" class="dashboard-document">
<head>
    <meta charset="UTF-8">
    <title data-i18n="app.name">Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="home">
    <div id="app-header"></div>

    <main class="page-content">
        <div style="margin-bottom:16px">
            <div style="font-size:13px;font-weight:700;color:var(--text-soft)" data-i18n="dashboard.welcomeBack">Welcome back,</div>
            <div id="home-greeting-name" style="font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.05;color:#fff">Learner</div>
        </div>

        <p id="home-signed-out" class="page-subtitle" data-i18n="dashboard.welcomeGuest">Sign in to save your progress, earn coins, and open your daily chest.</p>

        <div id="home-signed-in" hidden>
            <div class="home-chest-missions-row">
                <div id="home-chest-card" class="chest-card is-claimed"></div>

                <div class="home-missions-col">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                        <span style="font-weight:800;font-size:15px" data-i18n="mission.dailyMissions">Daily missions</span>
                        <span id="home-missions-count" style="font-size:11px;font-weight:800;color:var(--text-faint)">0 / 3</span>
                    </div>
                    <div id="home-missions-list" style="display:flex;flex-direction:column;gap:10px"></div>
                </div>
            </div>

            <a href="sprint.html" class="home-play-again-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <span data-i18n="home.playAgain">Play another round</span>
            </a>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <span style="font-weight:800;font-size:15px" data-i18n="dashboard.friendsCard">Friends</span>
                <a href="friends.html" style="font-size:11px;font-weight:800;color:var(--accent);text-decoration:none" data-i18n="home.thisWeek">This week &rsaquo;</a>
            </div>
            <div id="home-friends-preview" class="card" style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:2px"></div>
        </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="js/chest.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
