<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polytype Trainer</title>
  <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>Polytype Trainer</h1>
      </div>
      <div class="header-actions">
        <button id="my-deck-btn" class="deck-open-btn" type="button" aria-haspopup="dialog">
          <svg class="deck-open-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="7" height="7" rx="1.6"></rect>
            <rect x="14" y="4" width="7" height="7" rx="1.6"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.6"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.6"></rect>
          </svg>
          <span>My Deck</span>
        </button>

        <a id="auth-link" class="auth-menu-toggle auth-page-link" href="auth.html">Sign in</a>

        <div class="language-menu">
          <button id="language-menu-toggle" class="language-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Choose study language">
            <img id="current-language-flag" class="flag-mark" src="assets/flags/china.svg" alt="">
          </button>
          <div id="language-menu" class="language-menu-panel" role="menu" hidden></div>
        </div>

        <button id="theme-toggle" class="theme-icon-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.4A7.8 7.8 0 0 1 9.6 4 8 8 0 1 0 20 14.4Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="settings" aria-label="Practice settings">
        <a class="profile-pill" href="profile.html" aria-label="Open profile">
            <span class="profile-pill-avatar" aria-hidden="true">T</span>
            <span class="profile-pill-main">
                <strong id="mini-profile-level">Level 1</strong>
                <span id="mini-profile-xp">0 / 200 XP</span>
            </span>
            <span id="mini-profile-streak" class="profile-pill-streak">&#128293; 5</span>
        </a>

        <div id="level-field" class="field">
            <select id="level-select" aria-label="Level"></select>
        </div>

        <div id="romaji-field" class="field checkbox-field checkbox-wrapper-46">
            <input class="inp-cbx visually-hidden-checkbox"
                   id="romaji-toggle"
                   type="checkbox"
                   checked>
            <label class="cbx" for="romaji-toggle">
                <span>Pinyin</span>
            </label>
        </div>

        <div class="field">
            <label for="time-select">Time</label>
            <select id="time-select">
                <option value="0">Free</option>
                <option value="30">30 sec</option>
                <option value="60">1 min</option>
                <option value="180">3 min</option>
            </select>
        </div>

        <button id="restart-btn" class="restart-btn" type="button">
            Start
        </button>

        <button id="focus-toggle" class="theme-toggle" type="button" aria-pressed="false">
            Focus
        </button>
    </section>

    <section class="game-hud" aria-label="Session score">
      <div class="hud-item">
        <span class="hud-label">Time</span>
        <strong id="timer-text">Free</strong>
      </div>
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <strong id="hud-score-text">0 pts</strong>
      </div>
      <div class="hud-item" id="streak-hud">
        <span class="hud-label">Combo</span>
        <div class="streak-display">
          <strong id="streak-text">0</strong>
          <span id="streak-chip" class="streak-chip" hidden></span>
        </div>
      </div>
    </section>

    <section class="list-card" aria-label="Vocabulary drill">
      <div class="list-header">
        <span class="col-script">Word</span>
        <span class="col-meaning">Meaning</span>
      </div>

      <div id="rows-container"></div>
    </section>

    <section id="session-result" class="session-result" aria-live="polite" hidden>
      <div>
        <span class="result-label">Time up</span>
        <strong id="result-score">0 pts</strong>
        <span id="result-detail">0 correct / 0 fields</span>
        <span id="result-save-status" class="result-save-status"></span>
      </div>
      <button id="play-again-btn" class="restart-btn" type="button">Play again</button>
    </section>
  </main>

  <div id="my-deck-overlay" class="deck-overlay" role="dialog" aria-modal="true" aria-labelledby="deck-overlay-title" hidden>
    <div class="deck-overlay-backdrop" data-deck-close></div>
    <div class="deck-modal" role="document">
      <header class="deck-modal-head">
        <div class="deck-modal-headings">
          <span class="deck-modal-kicker">Collection</span>
          <h2 id="deck-overlay-title">My Deck</h2>
          <p id="deck-modal-sub" class="deck-modal-sub"></p>
        </div>
        <button id="my-deck-close" class="deck-modal-close" type="button" aria-label="Close" data-deck-close>&times;</button>
      </header>

      <div class="deck-progress">
        <div class="deck-progress-track">
          <span id="deck-progress-fill" class="deck-progress-fill"></span>
        </div>
        <span id="deck-progress-text" class="deck-progress-text"></span>
      </div>

      <div id="deck-groups" class="deck-groups"></div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="decks/index.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
