<!DOCTYPE html>
<html lang="en" class="dashboard-document">
<head>
    <meta charset="UTF-8">
    <title data-i18n="app.name">Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="home">
    <div id="app-header"></div>

    <main class="page-content">
        <div style="margin-bottom:16px">
            <div style="font-size:13px;font-weight:700;color:var(--text-soft)" data-i18n="dashboard.welcomeBack">Welcome back,</div>
            <div id="home-greeting-name" style="font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.05;color:#fff">Learner</div>
        </div>

        <p id="home-signed-out" class="page-subtitle" data-i18n="dashboard.welcomeGuest">Sign in to save your progress, earn coins, and open your daily chest.</p>

        <div id="home-signed-in" hidden>
            <!-- On a desktop width these two become side-by-side columns with
                 the leaderboard on the right (see .home-side-col in style.css);
                 on a phone they are just two stacked wrappers. -->
            <div class="home-main-col">
                <div id="home-daily-goal-card" class="card" style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:16px">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                        <span style="font-weight:800;font-size:14px" data-i18n="home.dailyGoal">Daily goal</span>
                        <span id="home-daily-goal-text" style="font-size:12px;font-weight:800;color:var(--text-faint)">0 / 50 XP</span>
                    </div>
                    <div class="mission-bar"><div id="home-daily-goal-fill" class="mission-bar-fill" style="width:0%"></div></div>
                </div>

                <div class="home-chest-missions-row">
                    <div id="home-chest-card" class="chest-card is-claimed"></div>

                    <div class="home-missions-col">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                            <span style="font-weight:800;font-size:15px" data-i18n="mission.dailyMissions">Daily missions</span>
                            <span id="home-missions-count" style="font-size:11px;font-weight:800;color:var(--text-faint)">0 / 3</span>
                        </div>
                        <div id="home-missions-list" style="display:flex;flex-direction:column;gap:10px"></div>
                        <!-- Says what clearing the set is worth, so the hard
                             third mission has a visible reason to exist.
                             js/dashboard.js hides it once all three are done. -->
                        <p id="home-missions-boost" class="home-missions-boost" data-i18n="mission.allThreeHint">Clear all 3 for 2x XP for 10 minutes</p>
                    </div>
                </div>

                <!-- Debug-only replay of the chest opening. js/dashboard.js keeps
                     this hidden unless the signed-in handle matches. -->
                <div id="home-demo-chest" hidden></div>

                <!-- Debug-only replay of a finished sprint - jumps to sprint.html
                     ?demo=finish for the real result card. Same handle gate. -->
                <div id="home-demo-sprint" hidden></div>

                <!-- TEMPORARY, same handle gate: a sprint made only of the two
                     example-sentence rounds being trialled (sprint.html?lab=cloze).
                     Delete with the "Lab round types" section in js/sprint.js. -->
                <div id="home-lab-cloze" hidden></div>

                <div class="home-cta-row">
                    <a href="sprint.html" class="home-play-again-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <span data-i18n="home.playAgain">Play</span>
                    </a>

                    <a href="lessons.html" id="home-lessons-btn" class="home-play-again-btn is-secondary" hidden>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
                        <span data-i18n="home.lessonsCta">Lessons</span>
                    </a>
                </div>

            </div>

            <aside class="home-side-col" aria-label="Leaderboard" data-i18n-aria-label="home.leaderboard">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <span style="font-weight:800;font-size:15px" data-i18n="dashboard.friendsCard">Friends</span>
                    <a href="friends.html" style="font-size:11px;font-weight:800;color:var(--accent);text-decoration:none" data-i18n="home.thisWeek">This week &rsaquo;</a>
                </div>
                <div id="home-friends-preview" class="card" style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:2px"></div>
            </aside>
        </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/virtual-keyboard.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <!-- Home doesn't show vocabulary itself, but it's the usual way into Deck
         and Sprint - loading the manifest + cache here lets app-shell.js warm
         the active language's CSV before either of those is opened. -->
    <script src="decks/index.js"></script>
    <script src="js/deck-cache.js"></script>
    <script src="js/levelup.js"></script>
    <script src="js/chest.js"></script>
    <!-- Home never completes a session itself, so these two are here purely
         for the debug sprint replay below - see renderDemoSprint in
         js/dashboard.js. -->
    <script src="js/mission-celebrate.js"></script>
    <script src="js/streak-celebrate.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
