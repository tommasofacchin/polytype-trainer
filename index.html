<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polytype Trainer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>Polytype Trainer</h1>
      </div>
      <div class="header-actions">
        <div class="auth-menu">
          <button id="auth-menu-toggle" class="auth-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false">
            Sign in
          </button>
          <div id="auth-menu-panel" class="auth-menu-panel" hidden>
            <form id="auth-form" class="auth-form">
              <label>
                Email
                <input id="auth-email" type="email" autocomplete="email" required>
              </label>
              <label>
                Password
                <input id="auth-password" type="password" autocomplete="current-password" required minlength="6">
              </label>
              <div class="auth-actions">
                <button id="auth-signin-btn" class="restart-btn" type="submit">Sign in</button>
                <button id="auth-register-btn" class="secondary-btn" type="button">Create</button>
              </div>
            </form>
            <div id="auth-user-panel" class="auth-user-panel" hidden>
              <strong id="auth-user-name">Signed in</strong>
              <span id="auth-user-email"></span>
              <button id="auth-signout-btn" class="secondary-btn" type="button">Sign out</button>
            </div>
            <p id="auth-status" class="auth-status" aria-live="polite"></p>
          </div>
        </div>

        <div class="language-menu">
          <button id="language-menu-toggle" class="language-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Choose study language">
            <img id="current-language-flag" class="flag-mark" src="assets/flags/china.svg" alt="">
          </button>
          <div id="language-menu" class="language-menu-panel" role="menu" hidden></div>
        </div>

        <button id="theme-toggle" class="theme-icon-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.4A7.8 7.8 0 0 1 9.6 4 8 8 0 1 0 20 14.4Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="settings" aria-label="Practice settings">
        <a class="profile-pill" href="profile.html" aria-label="Open profile">
            <span class="profile-pill-avatar" aria-hidden="true">T</span>
            <span class="profile-pill-main">
                <strong id="mini-profile-level">Level 1</strong>
                <span id="mini-profile-xp">0 / 200 XP</span>
            </span>
            <span id="mini-profile-streak" class="profile-pill-streak">&#128293; 5</span>
        </a>

        <div class="field">
            <select id="level-select" aria-label="Level"></select>
        </div>

        <div class="field checkbox-field checkbox-wrapper-46">
            <input class="inp-cbx visually-hidden-checkbox"
                   id="romaji-toggle"
                   type="checkbox"
                   checked>
            <label class="cbx" for="romaji-toggle">
                <span>Pinyin</span>
            </label>
        </div>

        <div class="field">
            <label for="time-select">Time</label>
            <select id="time-select">
                <option value="0">Free</option>
                <option value="30">30 sec</option>
                <option value="60">1 min</option>
                <option value="180">3 min</option>
            </select>
        </div>

        <button id="restart-btn" class="restart-btn" type="button">
            Start
        </button>

        <button id="focus-toggle" class="theme-toggle" type="button" aria-pressed="false">
            Focus
        </button>
    </section>

    <section class="game-hud" aria-label="Session score">
      <div class="hud-item">
        <span class="hud-label">Time</span>
        <strong id="timer-text">Free</strong>
      </div>
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <strong id="hud-score-text">0 pts</strong>
      </div>
      <div class="hud-item">
        <span class="hud-label">Combo</span>
        <strong id="streak-text">0</strong>
      </div>
    </section>

    <section class="list-card" aria-label="Vocabulary drill">
      <div class="list-header">
        <span class="col-script">Word</span>
        <span class="col-meaning">Meaning</span>
      </div>

      <div id="rows-container"></div>
    </section>

    <section id="session-result" class="session-result" aria-live="polite" hidden>
      <div>
        <span class="result-label">Time up</span>
        <strong id="result-score">0 pts</strong>
        <span id="result-detail">0 correct / 0 fields</span>
        <span id="result-save-status" class="result-save-status"></span>
      </div>
      <button id="play-again-btn" class="restart-btn" type="button">Play again</button>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-functions-compat.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="decks/index.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
