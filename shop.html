<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="shop.pageTitle">Shop - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="shop">
    <div id="app-header"></div>

    <main class="page-content" style="max-width:520px">
        <h1 class="page-title" data-i18n="shop.title">Shop</h1>

        <div class="settings-section">
            <div class="settings-card">
                <div class="settings-row">
                    <div class="settings-row-icon is-gold" id="shop-coin-icon" aria-hidden="true"></div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" id="shop-coin-label" data-i18n="shop.yourCoins">Your coins</span>
                        <p class="settings-row-help" id="shop-coin-balance">0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" id="shop-language-heading" data-i18n="shop.forLanguage">For this language</div>
            <div class="settings-card">
                <div class="settings-row">
                    <div class="settings-row-icon is-gold" id="shop-key-icon" aria-hidden="true"></div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" data-i18n="shop.keyItemTitle">Key</span>
                        <p class="settings-row-help" id="shop-item-keys-held"></p>
                    </div>
                    <button type="button" id="shop-buy-btn" class="btn-solid settings-save-btn"></button>
                </div>
            </div>
            <p id="shop-key-status" class="settings-status" aria-live="polite"></p>

            <div class="settings-card">
                <div class="settings-row">
                    <div class="settings-row-icon is-gold" id="shop-chest-icon" aria-hidden="true"></div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" data-i18n="shop.chestItemTitle">Word chest</span>
                        <p class="settings-row-help" id="shop-item-chest-missing"></p>
                    </div>
                    <button type="button" id="shop-buy-chest-btn" class="btn-solid settings-save-btn"></button>
                </div>
            </div>
            <p id="shop-chest-status" class="settings-status" aria-live="polite"></p>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" data-i18n="shop.forStreak">For your streak</div>
            <div class="settings-card">
                <div class="settings-row">
                    <div class="settings-row-icon is-gold" id="shop-freeze-icon" aria-hidden="true"></div>
                    <div class="settings-row-body">
                        <span class="settings-row-label" data-i18n="shop.freezeItemTitle">Streak freeze</span>
                        <p class="settings-row-help" id="shop-item-freezes-held"></p>
                    </div>
                    <button type="button" id="shop-buy-freeze-btn" class="btn-solid settings-save-btn"></button>
                </div>
            </div>
            <p id="shop-freeze-status" class="settings-status" aria-live="polite"></p>
        </div>
    </main>
    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/virtual-keyboard.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="decks/index.js"></script>
    <script src="decks/categories.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
