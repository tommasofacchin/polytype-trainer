<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="shop.pageTitle">Shop - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="shop">
    <div id="app-header"></div>

    <main class="page-content shop-page">
        <h1 class="page-title" data-i18n="shop.title">Shop</h1>

        <div class="shop-grid">
            <div class="shop-tile is-key">
                <div class="shop-tile-icon" id="shop-key-icon" aria-hidden="true"></div>
                <span class="shop-tile-title" data-i18n="shop.keyItemTitle">Key</span>
                <p class="shop-tile-sub" id="shop-item-keys-held"></p>
                <button type="button" id="shop-buy-btn" class="btn-solid shop-buy-btn"></button>
                <p id="shop-key-status" class="settings-status shop-tile-status" aria-live="polite"></p>
            </div>

            <div class="shop-tile is-chest">
                <div class="shop-tile-icon" id="shop-chest-icon" aria-hidden="true"></div>
                <span class="shop-tile-title" data-i18n="shop.chestItemTitle">Word chest</span>
                <p class="shop-tile-sub" id="shop-item-chest-missing"></p>
                <button type="button" id="shop-buy-chest-btn" class="btn-solid shop-buy-btn"></button>
                <p id="shop-chest-status" class="settings-status shop-tile-status" aria-live="polite"></p>
            </div>

            <div class="shop-tile shop-tile-wide is-freeze">
                <div class="shop-tile-icon" id="shop-freeze-icon" aria-hidden="true"></div>
                <div class="shop-tile-main">
                    <span class="shop-tile-title" data-i18n="shop.freezeItemTitle">Streak freeze</span>
                    <p class="shop-tile-sub" id="shop-item-freezes-held"></p>
                </div>
                <button type="button" id="shop-buy-freeze-btn" class="btn-solid shop-buy-btn"></button>
                <p id="shop-freeze-status" class="settings-status shop-tile-status" aria-live="polite"></p>
            </div>
        </div>
    </main>
    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/virtual-keyboard.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="decks/index.js"></script>
    <script src="decks/categories.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
