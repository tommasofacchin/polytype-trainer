<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="deck.pageTitle">Deck - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="deck">
    <div id="app-header"></div>

    <main class="page-content">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px">
            <h1 class="page-title" style="margin:0" data-i18n="deck.title">Deck</h1>
            <div class="language-menu">
                <button id="language-menu-toggle" class="language-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Choose study language" data-i18n-aria-label="trainer.chooseStudyLanguage">
                    <img id="current-language-flag" class="flag-mark" src="assets/flags/china.svg" alt="">
                </button>
                <div id="language-menu" class="language-menu-panel" role="menu" hidden></div>
            </div>
        </div>
        <p class="page-subtitle" data-i18n="deck.subtitle">Every word you've unlocked so far, grouped by category.</p>

        <div class="deck-progress">
            <div class="deck-progress-track">
                <span id="deck-progress-fill" class="deck-progress-fill"></span>
            </div>
            <span id="deck-progress-text" class="deck-progress-text"></span>
        </div>

        <div id="deck-groups" class="deck-groups"></div>
    </main>
    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="decks/index.js"></script>
    <script src="decks/categories.js"></script>
    <script src="js/deck.js"></script>
</body>
</html>
