<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="deck.pageTitle">Deck - Polytype Trainer</title>
    <link rel="icon" type="image/svg+xml" href="assets/flags/china.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="has-app-shell is-scroll-page" data-tab="deck">
    <div id="app-header"></div>

    <main class="page-content">
        <h1 class="page-title" data-i18n="deck.title">Deck</h1>

        <div class="deck-progress">
            <div class="deck-progress-track">
                <span id="deck-progress-fill" class="deck-progress-fill"></span>
            </div>
            <span id="deck-progress-text" class="deck-progress-text"></span>
            <span id="deck-mastered-text" class="deck-progress-text deck-mastered-text"></span>
        </div>

        <!-- Segmented filter over the whole deck: narrows the grids below to
             only unlocked or only still-locked doors. Counts are filled in by
             renderDeck so each option shows how much it would show. -->
        <div class="deck-filter" role="tablist" aria-label="Filter deck" data-i18n-aria-label="deck.filterLabel">
            <button type="button" class="deck-filter-btn is-active" role="tab" aria-selected="true" data-deck-filter="all">
                <span data-i18n="deck.filterAll">All</span>
                <span class="deck-filter-count" data-deck-filter-count="all"></span>
            </button>
            <button type="button" class="deck-filter-btn" role="tab" aria-selected="false" data-deck-filter="unlocked">
                <span data-i18n="deck.filterUnlocked">Unlocked</span>
                <span class="deck-filter-count" data-deck-filter-count="unlocked"></span>
            </button>
            <button type="button" class="deck-filter-btn" role="tab" aria-selected="false" data-deck-filter="locked">
                <span data-i18n="deck.filterLocked">Locked</span>
                <span class="deck-filter-count" data-deck-filter-count="locked"></span>
            </button>
        </div>

        <div id="deck-groups" class="deck-groups"></div>
    </main>

    <div id="unlock-confirm-overlay" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="unlock-confirm-title" hidden>
        <div class="confirm-overlay-backdrop" data-unlock-cancel></div>
        <div class="confirm-card" role="document">
            <h2 id="unlock-confirm-title" data-i18n="deck.confirmUnlockTitle">Unlock this word?</h2>
            <p id="unlock-confirm-body" class="confirm-card-body"></p>
            <p id="unlock-confirm-error" class="confirm-card-error" aria-live="polite" hidden></p>
            <p id="unlock-confirm-no-keys" class="confirm-card-note" aria-live="polite" hidden></p>
            <div class="confirm-actions">
                <button type="button" class="btn-ghost" data-unlock-cancel data-i18n="deck.confirmUnlockCancel">Not yet</button>
                <button type="button" id="unlock-confirm-btn" class="btn-solid" data-i18n="deck.confirmUnlockConfirm">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Tap an unlocked flashcard and it opens here, big, with example
         sentences underneath (decks/examples.js). Reuses .confirm-overlay for
         the backdrop and the open/close transition; only the card differs. -->
    <div id="word-detail-overlay" class="confirm-overlay word-detail-overlay" role="dialog" aria-modal="true" aria-labelledby="word-detail-script" hidden>
        <div class="confirm-overlay-backdrop" data-word-detail-close></div>
        <div class="word-detail-card" role="document">
            <button type="button" class="word-detail-close" data-word-detail-close aria-label="Close" data-i18n-aria-label="common.close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>

            <div class="word-detail-head">
                <span id="word-detail-script" class="word-detail-script"></span>
                <span id="word-detail-roman" class="word-detail-roman" hidden></span>
                <span id="word-detail-meaning" class="word-detail-meaning"></span>
                <button type="button" id="word-detail-audio" class="word-detail-audio" aria-label="Play audio" data-i18n-aria-label="deck.playAudio">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <div class="word-detail-examples">
                <span class="word-detail-examples-label" data-i18n="deck.examples">Examples</span>
                <ul id="word-detail-example-list" class="word-detail-example-list"></ul>
                <p id="word-detail-no-examples" class="word-detail-empty" data-i18n="deck.examplesComing" hidden>Example sentences for this word are on the way.</p>
            </div>
        </div>
    </div>

    <div id="app-bottom-nav"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/router.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/virtual-keyboard.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-client.js"></script>
    <script src="js/gamestate.js"></script>
    <script src="decks/index.js"></script>
    <script src="decks/categories.js"></script>
    <script src="decks/examples.js"></script>
    <script src="js/deck-cache.js"></script>
    <script src="js/deck.js"></script>
</body>
</html>
